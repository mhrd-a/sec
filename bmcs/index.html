<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Model Canvas Studio</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <!-- Header -->
  <header class="header-bg">
    <div class="header-container">
      <div class="logo-container">
        <img src="logo.png" alt="Logo" />
      </div>
      <div class="header-content">
        <input type="text" id="project-name" placeholder="Enter project name..." />
      </div>
    </div>
  </header>

  <!-- Main canvas container -->
  <div class="main-container">
    <div id="canvas-container">
      <!-- Canvas segments go here (dynamically handled) -->
    </div>
  </div>

  <!-- Modals -->
  <div id="emoji-modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-emoji-modal">Close</button>
      <div class="emoji-picker">
        <span>😀</span><span>🎯</span><span>💡</span><span>📈</span>
        <!-- Add more emojis as needed -->
      </div>
    </div>
  </div>

  <div id="templates-modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-templates-modal">Close</button>
      <div class="template-card" data-template="netflix">Netflix</div>
      <div class="template-card" data-template="openai">OpenAI</div>
      <!-- Add more templates -->
    </div>
  </div>

  <div id="confirmation-modal" class="confirmation-modal hidden">
    <div class="confirmation-content">
      <h3 id="confirmation-title">Confirm</h3>
      <p id="confirmation-message">Are you sure?</p>
      <div class="confirmation-buttons">
        <button id="cancel-action" class="btn btn-cancel">Cancel</button>
        <button id="confirm-action" class="btn btn-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Tools -->
  <footer>
    <div class="tools">
      <div id="add-note-tool" class="tool-item"><i class="fas fa-sticky-note tool-icon"></i><div class="tool-text">Note</div></div>
      <div id="add-emoji-tool" class="tool-item"><i class="fas fa-smile tool-icon"></i><div class="tool-text">Emoji</div></div>
      <div id="add-photo-tool" class="tool-item"><i class="fas fa-image tool-icon"></i><div class="tool-text">Photo</div></div>
      <div id="undo-tool" class="tool-item"><i class="fas fa-undo tool-icon"></i><div class="tool-text">Undo</div></div>
      <div id="redo-tool" class="tool-item"><i class="fas fa-redo tool-icon"></i><div class="tool-text">Redo</div></div>
      <div id="templates-tool" class="tool-item"><i class="fas fa-th-large tool-icon"></i><div class="tool-text">Templates</div></div>
      <div id="clear-tool" class="tool-item"><i class="fas fa-trash tool-icon"></i><div class="tool-text">Clear</div></div>
      <div id="export-tool" class="tool-item"><i class="fas fa-file-export tool-icon"></i><div class="tool-text">Export</div></div>
    </div>
  </footer>

  <input type="file" id="photo-input" accept="image/*" style="display: none" />
  <div id="notification" class="notification"><span id="notification-message"></span></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
